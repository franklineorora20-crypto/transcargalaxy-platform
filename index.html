    <script>
      window.__deferredPWAInstallPrompt = null;
      window.__isPWAInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPWAInstallPrompt = null;
        window.__isPWAInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BusTrip",
      "provider": {
        "@type": "Organization",
        "name": "TransCar Rongai Express",
        "url": "https://transcargalaxy-platform.vercel.app",
        "telephone": "+254722998877"
      },
      "departureBusStop": {
        "@type": "BusStation",
        "name": "Maasai Mall, Ongata Rongai, Nairobi"
      },
      "arrivalBusStop": {
        "@type": "BusStation",
        "name": "Kisii Town Central Bus Terminal, Kisii"
      },
      "offers": {
        "@type": "Offer",
        "priceCurrency": "KES",
        "availability": "https://schema.org/InStock",
        "validFrom": "2026-01-01"
      }
    }
    </script>
